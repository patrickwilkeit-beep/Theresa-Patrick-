<section id="welcomeScreen" aria-label="Willkommen">

    <svg viewBox="0 0 550 750" role="img" aria-labelledby="coverTitle coverDesc" xmlns="http://www.w3.org/2000/svg">
      <title id="coverTitle">LOVE &amp; PAIN</title>
      <desc id="coverDesc">Metallisch-rotes Herzmotiv.</desc>
      <defs>
        <linearGradient id="heartMetalRed" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4b0710"/>
          <stop offset=".22" stop-color="#a7192b"/>
          <stop offset=".48" stop-color="#ff5964"/>
          <stop offset=".68" stop-color="#8c0c20"/>
          <stop offset=".86" stop-color="#d52b3b"/>
          <stop offset="1" stop-color="#39040d"/>
        </linearGradient>
        <filter id="nameGlow" x="-35%" y="-60%" width="170%" height="220%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.55  0 0 0 0 0.02  0 0 0 0 0.05  0 0 0 .9 0" result="redGlow"/>
          <feMerge><feMergeNode in="redGlow"/><feMergeNode in="SourceGraphic"/></feMerge>

<script>
const today=new Date(); today.setHours(0,0,0,0);
const start=new Date(today);
const categories=["Romantik","Zärtlichkeiten","Oral","Anal","BDSM","Spanking","Fesseln","Intensiv","Massage","Selbstbefriedigung","Outdoor"];
let days = [], outdoorIdeas = [], state = null, account = null;
let view = "start", selected = 0, monthOffset = 0;
let editingToyId = null;

async function loadPrivateData(userId) {
  const { data: catalog, error } = await authClient.from("love_catalog")
    .select("couple_id, content").maybeSingle();
  if (error) throw error;
  if (!catalog) return null;

  const coupleId = catalog.couple_id;
  const [progress, personal, toys, toyChoices] = await Promise.all([
    authClient.from("love_progress").select("idea_id").eq("couple_id", coupleId),
    authClient.from("love_personal").select("kind, item_id, content").eq("user_id", userId),
    authClient.from("love_toys").select("id, name, categories, photo").eq("couple_id", coupleId).order("name"),
    authClient.from("love_toy_choices").select("idea_id, toy_id").eq("couple_id", coupleId)
  ]);
  if (progress.error) throw progress.error;
  if (personal.error) throw personal.error;
  if (toys.error) throw toys.error;
  if (toyChoices.error) throw toyChoices.error;
  return { catalog, progress: progress.data, personal: personal.data, toys: toys.data, toyChoices: toyChoices.data };
}

function startPrivateData(userId, data) {
  const { catalog, progress, personal } = data;
  const { ideas, outdoor } = catalog.content;
  account = { userId, coupleId: catalog.couple_id };
  days = Array.from({length:365}, (_, i) => ({ ...ideas[i % ideas.length], id:"d"+i, day:i }));
  outdoorIdeas = outdoor;
  state = { done: progress.map(row => row.idea_id), favs: [], wishes: [], custom: [], prefs: [...categories], toys: data.toys, toyChoices: data.toyChoices };
  for (const {kind, item_id: id, content} of personal) {
    if (kind === "favorite") state.favs.push(id);
    if (kind === "wish") state.wishes.push(id);
    if (kind === "custom") state.custom.push({ ...content, id });
    if (kind === "preference" && content === false) state.prefs = state.prefs.filter(cat => cat !== id);
  }
  render();
}

function clearPrivateData() {
  account = state = null;
  editingToyId = null;
  days = [];
  outdoorIdeas = [];
  view = "start";
  selected = monthOffset = 0;
  document.getElementById("app").replaceChildren();
}

async function saveItem(kind, id, keep, content = null) {
  const userId = account.userId;
  const table = authClient.from("love_personal");
  return keep
    ? table.upsert({ user_id:userId, kind, item_id:id, content })
    : table.delete().eq("user_id", userId).eq("kind", kind).eq("item_id", id);
}

let pending = null;
async function saveChange(request, apply) {
  if (!account || pending === account) return;
  const activeAccount = account;
  pending = activeAccount;
  try {
    const { error } = await request();
    if (activeAccount !== account) return;
    if (error) throw error;
    apply();
  } catch {
    if (activeAccount === account) alert("Änderung konnte nicht gespeichert werden. Bitte versuche es erneut.");
  } finally {
    if (pending === activeAccount) pending = null;
    if (activeAccount === account) render();
  }
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateAt(i){let d=new Date(start);d.setDate(d.getDate()+i);return d}
function fmt(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"})}
function allIdeas(){return [...days,...state.custom,...outdoorIdeas]}
function ideaById(id){return allIdeas().find(x=>x.id===id)}

const categoryIcons={"Romantik":"❤️","Zärtlichkeiten":"🥰","Oral":"👄","Anal":"🍑","BDSM":"⛓️","Spanking":"🔥","Fesseln":"🔗","Intensiv":"⚡","Massage":"💆","Selbstbefriedigung":"💋","Outdoor":"🌙"};
function categoryTag(cat){return `<span class="tag">${categoryIcons[cat]||"•"} ${esc(cat)}</span>`;}
function startView(){
  const cards=[
    ["📅","Kalender","Eure gemeinsamen Tage","kalender"],
    ["❤️","Romantik","Zärtlichkeit und Nähe","kalender","Romantik"],
    ["🥰","Zärtlichkeiten","Nähe und Geborgenheit","kalender","Zärtlichkeiten"],
    ["👄","Oral","Nur nach beiderseitigem Wunsch","kalender","Oral"],
    ["🍑","Anal","Mit Ruhe und klaren Grenzen","kalender","Anal"],
    ["⛓️","BDSM","Vertrauen und klare Grenzen","kalender","BDSM"],
    ["🔥","Spanking","Vorher vereinbarte Intensität","kalender","Spanking"],
    ["🔗","Fesseln","Sicher und jederzeit lösbar","kalender","Fesseln"],
    ["⚡","Intensiv","Nur mit klarer Absprache","kalender","Intensiv"],
    ["💆","Massage","Entspannung und Berührung","kalender","Massage"],
    ["💋","Selbstbefriedigung","Eigene und gemeinsame Wünsche","kalender","Selbstbefriedigung"],
    ["🌙","Outdoor","Freiwillige Wochenendideen","outdoor"],
    ["☆","Favoriten","Eure gemerkten Ideen","favoriten"],
    ["🔒","Privatbereich","Persönliche Listen","listen"]
  ];
  return `<div class="home-hero">
    <div class="home-kicker">Zeit für uns zwei</div>
    <h1>LOVE &amp; PAIN</h1>
    <p>Euer gemeinsamer privater Bereich für Ideen, Wünsche und besondere Momente.</p>
    <button class="primary" onclick="goView('kalender')">Zum gemeinsamen Kalender</button>
  </div>
  <div class="home-actions">${cards.map(c=>`<button class="home-card" onclick="goView('${c[3]}',${c[4]?`'${c[4]}'`:"null"})">
    <span class="home-icon">${c[0]}</span><strong>${c[1]}</strong><small>${c[2]}</small></button>`).join("")}</div>
  <div class="panel"><h2>Schichtmodell</h2><p class="muted">Der Wochenrhythmus wechselt in dieser Reihenfolge: Nacht → Spät → Früh. Frühschicht: Mo–Fr, 06:00–14:00 · Spätschicht: Mo–Fr, 14:00–22:00 · Nachtschicht: fünf Nächte von So 22:00 bis Fr 06:00; die letzte Schicht läuft Do 22:00–Fr 06:00. Wochenendarbeit bleibt freiwillig.</p></div>
  <p class="small" style="text-align:center;margin-top:16px">Private Inhalte werden hier nicht eingeblendet.</p>`;
}
function goView(v,cat=null){
  view=v;
  if(cat){const ix=days.findIndex(x=>x.cat===cat);if(ix>=0)selected=ix;}
  render();
}

function render(){
if (!state) return;
document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
let root=document.getElementById("app");
if(view==="start") root.innerHTML=startView();
if(view==="kalender") root.innerHTML=calendarView();
if(view==="listen") root.innerHTML=listView();
if(view==="favoriten") root.innerHTML=favView();
if(view==="vorlieben") root.innerHTML=prefsView();
if(view==="eigene") root.innerHTML=customView();
if(view==="outdoor") root.innerHTML=outdoorView();
if(view==="toys") root.innerHTML=toyGalleryView();
}
function toyPhoto(toy) {
  return /^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(toy.photo || "")
    ? `<img src="${toy.photo}" alt="${esc(toy.name)}" loading="lazy">`
    : "";
}

function toyGalleryView() {
  const editing = state.toys.find(toy => toy.id === editingToyId);
  const cards = state.toys.map(toy => `<article class="toy-card">
    ${toyPhoto(toy)}
    <h3>${esc(toy.name)}</h3>
    <div>${toy.categories.map(categoryTag).join(" ")}</div>
    <div class="actions"><button onclick="editToy('${toy.id}')">Bearbeiten</button></div>
  </article>`).join("");
  return `<div class="panel">
    <h2>Toys-Galerie</h2>
    <p class="muted">Wählt beim Anlegen passende Kategorien. Bei einer Kalenderaktivität erscheinen eure Toys aus dieser Kategorie als Vorschlag.</p>
    <div class="toy-grid">${cards || '<p>Ihr habt noch keine Toys eingetragen.</p>'}</div>
  </div>
  <form id="toyForm" class="panel toy-form" onsubmit="saveToy(event)">
    <h2>${editing ? "Toy bearbeiten" : "Toy hinzufügen"}</h2>
    <label for="toyName">Name</label><input id="toyName" maxlength="80" required value="${esc(editing?.name || "")}">
    <label for="toyPhoto">Foto (optional)</label><input id="toyPhoto" type="file" accept="image/*">
    ${editing?.photo ? '<label class="toy-option"><input id="removeToyPhoto" type="checkbox">Vorhandenes Foto entfernen</label>' : ""}
    <fieldset><legend>Passend zu</legend><div class="toy-categories">${categories.map(cat =>
      `<label><input type="checkbox" name="toyCategory" value="${esc(cat)}" ${editing?.categories.includes(cat) ? "checked" : ""}>${esc(cat)}</label>`
    ).join("")}</div></fieldset>
    <div class="actions"><button class="primary" type="submit">Speichern</button>
      ${editing ? `<button type="button" onclick="editToy(null)">Abbrechen</button>
        <button type="button" onclick="removeToy('${editing.id}')">Toy entfernen</button>` : ""}
    </div>
    <p id="toyStatus" role="status"></p>
  </form>`;
}

function editToy(id) {
  editingToyId = id;
  render();
  document.getElementById("toyName")?.focus();
}

async function resizeToyPhoto(file) {
  if (file.size > 20 * 1024 * 1024) throw new Error("Das Foto darf höchstens 20 MB groß sein.");
  const bitmap = await createImageBitmap(file);
  try {
    const scale = Math.min(1, 720 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const context = canvas.getContext("2d");
    context.fillStyle = "#160d12";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const photo = canvas.toDataURL("image/jpeg", 0.75);
    if (photo.length > 400000) throw new Error("Das Foto ist zu groß. Wähle bitte ein kleineres Bild.");
    return photo;
  } finally {
    bitmap.close();
  }
}

async function saveToy(event) {
  event.preventDefault();
  if (!account || pending === account) return;
  const active = account;
  const form = event.currentTarget;
  const button = form.querySelector('button[type="submit"]');
  const status = form.querySelector("#toyStatus");
  const name = form.querySelector("#toyName").value.trim();
  if (!name) {
    status.textContent = "Bitte gib einen Namen ein.";
    return;
  }
  const editing = state.toys.find(toy => toy.id === editingToyId);
  const tags = new FormData(form).getAll("toyCategory");
  const file = form.querySelector("#toyPhoto").files[0];
  const clearPhoto = form.querySelector("#removeToyPhoto")?.checked;
  button.disabled = true;
  pending = active;
  try {
    const photo = file ? await resizeToyPhoto(file) : (clearPhoto ? null : editing?.photo ?? null);
    if (active !== account) return;
    const toy = {id: editing?.id ?? crypto.randomUUID(), name, categories: tags, photo};
    const {error} = await authClient.from("love_toys").upsert({...toy, couple_id: active.coupleId});
    if (active !== account) return;
    if (error) throw new Error("Das Toy konnte nicht gespeichert werden. Bitte versuche es erneut.");
    state.toys = [...state.toys.filter(item => item.id !== toy.id), toy]
      .sort((a, b) => a.name.localeCompare(b.name, "de"));
    editingToyId = null;
    render();
  } catch (error) {
    status.textContent = error.message || "Das Bild konnte nicht verarbeitet werden.";
  } finally {
    if (pending === active) pending = null;
    button.disabled = false;
  }
}

function removeToy(toyId) {
  if (!confirm("Dieses Toy aus der Galerie und allen Kalenderaktivitäten entfernen?")) return;
  saveChange(() => authClient.from("love_toys").delete().eq("couple_id", account.coupleId).eq("id", toyId), () => {
    state.toys = state.toys.filter(toy => toy.id !== toyId);
    state.toyChoices = state.toyChoices.filter(choice => choice.toy_id !== toyId);
    editingToyId = null;
  });
}

function toyChoicesView(idea) {
  const suggested = state.toys.filter(toy => toy.categories.includes(idea.cat));
  const other = state.toys.filter(toy => !toy.categories.includes(idea.cat));
  const selectedIds = new Set(state.toyChoices.filter(choice => choice.idea_id === idea.id).map(choice => choice.toy_id));
  const option = toy => `<label class="toy-option"><input type="checkbox"
    onchange="chooseToy('${idea.id}','${toy.id}',this.checked)" ${selectedIds.has(toy.id) ? "checked" : ""}>
    ${esc(toy.name)}</label>`;
  return `<div class="panel"><div class="row"><h2>Toys für diese Aktivität</h2>
    <button onclick="goView('toys')">Zur Galerie</button></div>
    ${state.toys.length ? `<h3>Passende Vorschläge</h3>
      ${suggested.map(option).join("") || '<p class="muted">Noch keine Toys für diese Kategorie hinterlegt.</p>'}
      ${other.length ? `<h3>Weitere Toys</h3>${other.map(option).join("")}` : ""}`
      : '<p class="muted">Fügt zuerst ein Toy in der Galerie hinzu.</p>'}
  </div>`;
}

function chooseToy(ideaId, toyId, checked) {
  if (!account) return;
  if (pending === account) {
    render();
    return;
  }
  saveChange(() => {
    const table = authClient.from("love_toy_choices");
    const coupleId = account.coupleId;
    return checked ? table.upsert({couple_id: coupleId, idea_id: ideaId, toy_id: toyId})
      : table.delete().eq("couple_id", coupleId).eq("idea_id", ideaId).eq("toy_id", toyId);
  }, () => {
    state.toyChoices = state.toyChoices.filter(choice => choice.idea_id !== ideaId || choice.toy_id !== toyId);
    if (checked) state.toyChoices.push({idea_id: ideaId, toy_id: toyId});
  });
}

function prefsView(){return `<div class="panel"><h2>Unsere Vorlieben</h2><p class="muted">Wählt aus, welche Arten von Ideen ihr im Zufallsgenerator bevorzugt. Alles kann jederzeit geändert werden.</p>${categories.map(c=>`<label class="checkline"><input type="checkbox" ${state.prefs.includes(c)?"checked":""} onchange="togglePref('${c}',this.checked)">${categoryIcons[c]||"•"} ${c}</label>`).join("")}<p class="small">Bei BDSM-Ideen gilt: vorher Grenzen, Safeword und gegenseitiges Einverständnis klären.</p></div>`}
function customView(){return `<div class="panel"><h2>Eigene Idee hinzufügen</h2><label class="small">Kategorie</label><select id="newcat">${categories.map(c=>`<option>${c}</option>`).join("")}</select><label class="small">Eure Idee</label><textarea id="newtext" placeholder="Schreibt eure eigene Idee auf …"></textarea><button class="primary" onclick="addCustom()">Idee speichern</button></div><div class="panel"><h2>Eigene Ideen</h2>${state.custom.length?state.custom.map(x=>`<div class="listitem">${categoryTag(x.cat)}<div>${esc(x.text)}</div><button style="margin-top:8px" onclick="deleteCustom('${x.id}')">Löschen</button></div>`).join(""):'<div class="emptymsg">Hier erscheinen eure eigenen Ideen.</div>'}</div>`}
function changeMonth(n){monthOffset+=n;render()}function selectDay(i){selected=i;monthOffset=0;render()}
function toggleDone(id, checked) {
  saveChange(() => {
    const table = authClient.from("love_progress");
    const coupleId = account.coupleId;
    return checked ? table.upsert({couple_id:coupleId, idea_id:id})
      : table.delete().eq("couple_id", coupleId).eq("idea_id", id);
  }, () => {
    state.done = checked ? [...new Set([...state.done, id])] : state.done.filter(item => item !== id);
  });
}
function toggleFav(id) {
  const add = !state.favs.includes(id);
  saveChange(() => saveItem("favorite", id, add), () => {
    state.favs = add ? [...state.favs, id] : state.favs.filter(item => item !== id);
  });
}
function addToList(id) {
  if (!state.wishes.includes(id)) {
    saveChange(() => saveItem("wish", id, true), () => state.wishes.push(id));
  }
}
function removeList(id) {
  saveChange(() => saveItem("wish", id, false), () => {
    state.wishes = state.wishes.filter(item => item !== id);
  });
}
function togglePref(cat, checked) {
  saveChange(() => saveItem("preference", cat, !checked, false), () => {
    state.prefs = checked ? [...new Set([...state.prefs, cat])] : state.prefs.filter(item => item !== cat);
  });
}
function randomIdea(){let pool=days.filter(x=>state.prefs.includes(x.cat));if(!pool.length)pool=days;let x=pool[Math.floor(Math.random()*pool.length)];selected=x.day;monthOffset=0;render()}
function selectById(id){let x=ideaById(id);if(x&&x.day!==undefined){selected=x.day;view="kalender";render()}else if(x&&x.cat==="Outdoor"){view="outdoor";render()}}
function addCustom() {
  const text = document.getElementById("newtext").value.trim();
  if (!text) return alert("Bitte zuerst eine Idee eingeben.");
  const id = "c" + crypto.randomUUID();
  const cat = document.getElementById("newcat").value;
  saveChange(() => saveItem("custom", id, true, {cat, text}), () => state.custom.push({id, cat, text}));
}
function deleteCustom(id) {
  saveChange(() => authClient.from("love_personal").delete()
    .eq("user_id", account.userId).eq("item_id", id), () => {
    state.custom = state.custom.filter(idea => idea.id !== id);
    state.favs = state.favs.filter(item => item !== id);
    state.wishes = state.wishes.filter(item => item !== id);
  });
}
document.getElementById("tabs").addEventListener("click",e=>{let b=e.target.closest("button[data-view]");if(b){view=b.dataset.view;render()}});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script>
  




<script>
(function () {
  const authMessage = document.getElementById("authMessage");
  const authGate = document.getElementById("authGate");
  const appMain = document.getElementById("appMain");
  const accountBar = document.getElementById("accountBar");
  const emailInput = document.getElementById("authEmail");
  const passwordInput = document.getElementById("authPassword");
  const welcomeScreen = document.getElementById("welcomeScreen");
  const siteHeader = document.getElementById("siteHeader");
  const loginForm = document.getElementById("loginForm");
  const recoveryForm = document.getElementById("recoveryForm");
  const newPassword = document.getElementById("newPassword");
  const confirmPassword = document.getElementById("confirmPassword");
  const savePassword = document.getElementById("savePassword");
  const resetBtn = document.getElementById("resetBtn");
  const callbackError = authCallback.has("error") || authCallback.has("error_code");
  let entered = callbackError;
  let accessAttempt = 0;
  let recoverySession = false;

  document.getElementById("enterButton").addEventListener("click", () => {
    entered = true;
    welcomeScreen.style.display = "none";
    authGate.style.display = "block";
    siteHeader.style.display = "none";
    if (!authClient) {
      showMessage("Die Anmeldung konnte nicht geladen werden. Bitte lade die Seite erneut.");
    }
    emailInput.focus();
  });

  function showMessage(message, isError = true) {
    authMessage.textContent = message;
    authMessage.style.color = isError ? "#ff9aa4" : "#91d6aa";
  }

  function credentials() {
    return {
      email: emailInput.value.trim(),
      password: passwordInput.value
    };
  }

  async function openPrivateArea(user) {
    if (account?.userId === user.id) return;
    const attempt = ++accessAttempt;
    try {
      const data = await loadPrivateData(user.id);
      if (attempt !== accessAttempt || recoverySession) return;
      if (!data) {
        entered = true;
        await authClient.auth.signOut({scope:"local"});
        showMessage("Dieses Konto hat keinen Zugang zum privaten Bereich.");
        return;
      }
      startPrivateData(user.id, data);
      showSignedIn(user);
    } catch {
      if (attempt !== accessAttempt) return;
      entered = true;
      showSignedOut();
      showMessage("Der private Bereich konnte nicht geladen werden. Bitte versuche es erneut.");
    }
  }

  function showSignedIn(user) {
    recoveryForm.hidden = true;
    loginForm.hidden = false;
    passwordInput.value = "";
    welcomeScreen.style.display = "none";
    authGate.style.display = "none";
    siteHeader.style.display = "block";
    appMain.style.display = "block";
    accountBar.style.display = "block";
    accountBar.replaceChildren();
    const label = document.createElement("span");
    label.textContent = "Angemeldet als " + (user.email || "Nutzer") + " ";
    accountBar.appendChild(label);
    const logout = document.createElement("button");
    logout.type = "button";
    logout.textContent = "Abmelden";
    logout.addEventListener("click", async () => {
      const { error } = await authClient.auth.signOut();
      if (error) alert("Abmelden fehlgeschlagen: " + error.message);
    });
    accountBar.appendChild(logout);
  }

  function showSignedOut() {
    ++accessAttempt;
    clearPrivateData();
    recoverySession = false;
    recoveryForm.reset();
    recoveryForm.hidden = true;
    loginForm.hidden = false;
    welcomeScreen.style.display = entered ? "none" : "flex";
    authGate.style.display = entered ? "block" : "none";
    siteHeader.style.display = "none";
    appMain.style.display = "none";
    accountBar.style.display = "none";
    accountBar.replaceChildren();
  }

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const { email, password } = credentials();
    if (!authClient) return;
    if (!email || !password) return showMessage("Bitte E-Mail-Adresse und Passwort eingeben.");
    showMessage("Anmeldung läuft …", false);
    const { error } = await authClient.auth.signInWithPassword({ email, password });
    if (error) showMessage("Anmeldung fehlgeschlagen: " + error.message);
  });

  recoveryForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!recoverySession || savePassword.disabled) return;
    if (newPassword.value !== confirmPassword.value) {
      showMessage("Die Passwörter stimmen nicht überein.");
      confirmPassword.focus();
      return;
    }

    savePassword.disabled = true;
    showMessage("Passwort wird gespeichert …", false);
    try {
      const { error } = await authClient.auth.updateUser({ password: newPassword.value });
      if (error) {
        showMessage("Passwort konnte nicht gespeichert werden: " + error.message);
        return;
      }
      if (recoverySession) {
        recoverySession = false;
        recoveryForm.reset();
        await authClient.auth.signOut({scope:"local"});
        showSignedOut();
        showMessage("Passwort gespeichert. Melde dich jetzt mit dem neuen Passwort an.", false);
      }
    } catch {
      showMessage("Verbindung fehlgeschlagen. Bitte versuche es erneut.");
    } finally {
      savePassword.disabled = false;
    }
  });

  resetBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    if (!authClient) return;
    if (!email || !emailInput.checkValidity()) return showMessage("Gib zuerst deine E-Mail-Adresse ein.");
    resetBtn.disabled = true;
    showMessage("Link zum Zurücksetzen wird angefordert …", false);
    try {
      const { error } = await authClient.auth.resetPasswordForEmail(email, {
        redirectTo: new URL("./", window.location.href).href
      });
      if (error) {
        if (error.code === "email_address_not_authorized" || /email address not authorized/i.test(error.message)) {
          return showMessage("Der E-Mail-Versand für diese Adresse ist noch nicht eingerichtet.");
        }
        const message = error.status === 429
          ? "Bitte warte kurz, bevor du einen weiteren Link anforderst."
          : "Die E-Mail konnte nicht angefordert werden. Bitte versuche es später erneut.";
        return showMessage(message);
      }
      showMessage("Wenn ein Konto existiert, kommt der Link per E-Mail. Schau auch im Spamordner nach.", false);
    } catch {
      showMessage("Verbindung fehlgeschlagen. Bitte versuche es erneut.");
    } finally {
      resetBtn.disabled = false;
    }
  });

  if (callbackError) {
    history.replaceState(null, "", location.pathname + location.search);
    showMessage("Der Link ist ungültig oder abgelaufen. Fordere einen neuen Link an.");
  }

  if (!authClient) return;
  authClient.auth.onAuthStateChange((event, session) => {
    if (!session?.user) {
      showSignedOut();
      return;
    }
    if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && authCallback.get("type") === "invite")) {
      entered = true;
      showSignedOut();
      recoverySession = true;
      loginForm.hidden = true;
      recoveryForm.hidden = false;
      showMessage("Wähle ein neues Passwort für dein Konto.", false);
      newPassword.focus();
      return;
    }
    if (!recoverySession) {
      setTimeout(() => {
        if (!recoverySession) void openPrivateArea(session.user);
      }, 0);
    }
  });
})();
</script>
