function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function ideaById(id){return allIdeas().find(x=>x.id===id)}

function calendarView(){

for(let n=1;n<=count;n++){let idx=Math.round((new Date(year,month,n)-start)/86400000);let valid=idx>=0&&idx<365;html+=`<button class="day ${valid&&idx===selected?"selected":""} ${valid&&state.done.includes("d"+idx)?"done":""} ${valid&&dateAt(idx).getTime()===today.getTime()?"today":""}" ${valid?`onclick="selectDay(${idx})"`:"disabled"}>${n}<span class="day-cat-icon">${categoryIcons[days[idx]?.cat]||""}</span></button>`}

let idea=days[selected];
html+=`<div class="panel"><div class="small">${fmt(d)} · Tag ${selected+1} von 365</div><h2 style="margin-top:5px">Eure Idee des Tages</h2>${categoryTag(idea.cat)}<div class="idea"><h3>${esc(idea.text)}</h3></div><div class="detail-card"><span class="detail-label">👥 Wer macht was?</span><strong>${esc(idea.roles)}</strong></div><div class="detail-grid"><div class="detail-card"><span class="detail-label">⏱ Zeit einplanen</span><strong>${esc(idea.duration)}</strong></div><div class="detail-card"><span class="detail-label">⚡ Intensität</span><strong>${esc(idea.level)}</strong></div></div><div class="detail-card"><span class="detail-label">🧰 Benötigte Utensilien / Vorbereitung</span><ul class="materials">${idea.materials.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><p class="small">Die Angaben sind Vorschläge. Passt Dauer und Material gemeinsam an; Zustimmung, Grenzen und jederzeitige Pause haben Vorrang.</p><label class="checkline"><input type="checkbox" ${state.done.includes(idea.id)?"checked":""} onchange="toggleDone('${idea.id}',this.checked)"> Als erledigt markieren</label><div class="actions"><button class="primary" onclick="toggleFav('${idea.id}')">${state.favs.includes(idea.id)?"★ Favorit entfernen":"☆ Als Favorit speichern"}</button><button onclick="randomIdea()">🎲 Zufallsidee</button></div><div class="actions"><button class="ghost" onclick="addToList('${idea.id}','Theresa')">+ Theresa-Wunschliste</button><button class="ghost" onclick="addToList('${idea.id}','Patrick')">+ Patrick-Wunschliste</button></div></div>`;

html+=`<div class="panel"><div class="row"><h2>Fortschritt</h2><strong>${state.done.filter(x=>x[0]==="d").length} / 365</strong></div><div style="height:8px;background:#38242e;border-radius:9px;overflow:hidden"><div style="height:100%;width:${Math.min(100,state.done.filter(x=>x[0]==="d").length/365*100)}%;background:linear-gradient(90deg,var(--wine2),var(--gold))"></div></div></div>`;

}
function outdoorView(){return `<div class="panel"><div class="small">🌙 FREIWILLIG · WOCHENENDE</div><h2>Outdoor &amp; gemeinsame Auszeit</h2><p class="muted">Diese Vorschläge sind Ideen, keine Aufgaben. Ihr entscheidet jedes Mal gemeinsam, ob, wann und worauf ihr Lust habt. In der Öffentlichkeit bleibt alles diskret und rücksichtsvoll gegenüber Unbeteiligten.</p></div>${outdoorIdeas.map(x=>`<div class="panel"><div class="row"><h3>${categoryIcons.Outdoor} ${esc(x.text.split(":")[0])}</h3><span class="tag">Optional</span></div><p>${esc(x.text)}</p><div class="actions"><button class="primary" onclick="toggleFav('${x.id}')">${state.favs.includes(x.id)?"★ Favorit entfernen":"☆ Favorit"}</button><button onclick="addToList('${x.id}','Theresa')">+ Theresa</button><button onclick="addToList('${x.id}','Patrick')">+ Patrick</button></div></div>`).join("")}<div class="panel"><h2>Gemeinsame Regel</h2><p class="muted">Vorher kurz absprechen: Ort, Grenzen, Budget und jederzeitige Möglichkeit, die Idee zu ändern oder abzubrechen. Aktivitäten mit intimerem Charakter gehören ausschließlich in einen privaten, dafür geeigneten Rahmen.</p></div>`}
function listView(){let h='<div class="panel"><h2>Wunschlisten</h2><p class="muted">Getrennte Listen auf diesem Gerät. Ohne PIN sind sie nicht vor anderen Personen geschützt.</p></div>';for(let who of ["Theresa","Patrick"]){h+=`<div class="panel"><h2>${who}</h2>`;let arr=state.lists[who];if(!arr.length)h+='<div class="emptymsg">Noch keine Wünsche gespeichert.</div>';arr.forEach(id=>{let x=ideaById(id);if(x)h+=`<div class="listitem"><div class="row"><div>${categoryTag(x.cat)}<div>${esc(x.text)}</div></div><button onclick="removeList('${who}','${id}')">Entfernen</button></div></div>`});h+='</div>'}return h}

function prefsView(){return `<div class="panel"><h2>Unsere Vorlieben</h2><p class="muted">Wählt aus, welche Arten von Ideen ihr im Zufallsgenerator bevorzugt. Alles kann jederzeit geändert werden.</p>${categories.map(c=>`<label class="checkline"><input type="checkbox" ${state.prefs.includes(c)?"checked":""} onchange="togglePref('${c}',this.checked)">${categoryIcons[c]||"•"} ${c}</label>`).join("")}<p class="small">Bei BDSM-Ideen gilt: vorher Grenzen, Safeword und gegenseitiges Einverständnis klären.</p></div>`}

function toggleFav(id){state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];save();render()}

function removeList(who,id){state.lists[who]=state.lists[who].filter(x=>x!==id);save();render()}
function togglePref(c,v){state.prefs=v?[...state.prefs,c]:state.prefs.filter(x=>x!==c);save()}
function randomIdea(){let pool=days.filter(x=>state.prefs.includes(x.cat));if(!pool.length)pool=days;let x=pool[Math.floor(Math.random()*pool.length)];selected=x.day;monthOffset=0;render()}
function selectById(id){let x=ideaById(id);if(x&&x.day!==undefined){selected=x.day;view="kalender";render()}else if(x&&x.cat==="Outdoor"){view="outdoor";render()}}
function addCustom(){let t=document.getElementById("newtext").value.trim();if(!t){alert("Bitte zuerst eine Idee eingeben.");return}state.custom.push({id:"c"+Date.now(),cat:document.getElementById("newcat").value,text:t});save();render()}
function deleteCustom(id){state.custom=state.custom.filter(x=>x.id!==id);state.favs=state.favs.filter(x=>x!==id);for(let w of Object.keys(state.lists))state.lists[w]=state.lists[w].filter(x=>x!==id);save();render()}
